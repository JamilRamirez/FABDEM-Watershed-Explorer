name: Patch poblados dominant server propagation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-poblados-dominant-server.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply server propagation patch
        run: python .github/scripts/patch_poblados_dominant_server.py

      - name: Validate patch
        run: |
          git diff --check
          grep -n "dominant_department = info\$dominant_department\|dominant_province = info\$dominant_province\|dominant_district = info\$dominant_district" R/poblados.R

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/poblados.R
          if ! git diff --cached --quiet; then
            git commit -m "Fix dominant territory propagation in poblados"
            git push origin main
          fi
