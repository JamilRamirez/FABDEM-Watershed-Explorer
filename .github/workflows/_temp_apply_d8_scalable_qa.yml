name: TEMP Apply scalable D8 QA

on:
  push:
    branches:
      - fix/d8-contiguous-polygon-final
    paths:
      - .github/workflows/_temp_apply_d8_scalable_qa.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d8-contiguous-polygon-final
          fetch-depth: 0

      - name: Apply scalable QA patch
        run: python3 tests/ci/_apply_d8_scalable_qa.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/helpers.R tests/ci/smoke_app.R
          git commit -m "Escala QA de continuidad D8 para cuencas grandes" || exit 0
          git push origin HEAD:fix/d8-contiguous-polygon-final
