name: Apply Google Earth export patch

on:
  push:
    branches:
      - feature/google-earth-kml-simplification
    paths:
      - .github/workflows/apply-google-earth-export-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/google-earth-kml-simplification
          fetch-depth: 0

      - name: Apply R-only patch
        run: python3 scripts/apply_google_earth_r_only.py

      - name: Commit functional change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/helpers.R R/delimitacion.R
          git diff --cached --stat
          git commit -m "Compatibiliza KML y KMZ complejos con Google Earth"
          git push origin HEAD:feature/google-earth-kml-simplification
