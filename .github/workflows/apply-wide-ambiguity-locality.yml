name: Apply wide ambiguity locality

on:
  push:
    branches:
      - feature/ambiguous-outlet-choice

permissions:
  contents: write

concurrency:
  group: apply-wide-ambiguity-locality
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ambiguous-outlet-choice
          fetch-depth: 0

      - name: Apply locality gate
        run: python tools/ci/fix_wide_ambiguity_locality.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- R/delimitacion.R; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/delimitacion.R
          git commit -m "Limita ambiguedad multicanal a reuniones D8 locales"
          git push origin HEAD:feature/ambiguous-outlet-choice
