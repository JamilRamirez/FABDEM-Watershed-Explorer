name: FABDEM Real Delineation Smoke

on:
  push:
    branches:
      - 'qa/real-delineation-smoke-*'
    paths:
      - 'tests/qa/delineation_cases.csv'
      - 'tests/qa/run_real_delineation_smoke.R'
      - '.github/workflows/delineation-real-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabdem-real-delineation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-delineation:
    name: Real delineation - ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: stations
            timeout: 90
          - group: quebradas
            timeout: 90
          - group: transnational
            timeout: 240
          - group: negative
            timeout: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R 4.6.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install app dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::leaflet
            any::sf
            any::terra
            any::DT
            any::readxl
          cache-version: 2
          install-pandoc: false
          install-quarto: false

      - name: Run real delineation QA
        env:
          CI: 'true'
          QA_GROUP: ${{ matrix.group }}
        run: Rscript tests/qa/run_real_delineation_smoke.R

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delineation-qa-${{ matrix.group }}
          path: qa_results/${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 7
