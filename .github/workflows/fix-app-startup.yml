name: Fix app startup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-app-startup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fix invalid adjacent R strings in notification CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.R')
          text = path.read_text(encoding='utf-8')

          old = '''    tags$style(\n      HTML(\n        ".shiny-notification{pointer-events:auto!important;}\\n"\n        ".shiny-notification-close{pointer-events:auto!important;cursor:pointer!important;z-index:2;}\\n"\n      )\n    ),\n'''

          new = '''    tags$style(\n      HTML(\n        ".shiny-notification{pointer-events:auto!important;}\\n.shiny-notification-close{pointer-events:auto!important;cursor:pointer!important;z-index:2;}\\n"\n      )\n    ),\n'''

          if old not in text:
              raise RuntimeError('No se encontro el bloque CSS invalido esperado en app.R')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/fix-app-startup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.R
          git commit -m 'Restaura inicio de la app tras ajuste de avisos'
          git push
