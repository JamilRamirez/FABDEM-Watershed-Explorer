name: Hotfix far snap guard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hotfix-far-snap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply conservative far-snap guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('R/delimitacion.R')
          text = path.read_text(encoding='utf-8')

          old_constants = """  AMBIGUITY_WIDE_TRIGGER_M <- 300\n  AMBIGUITY_WIDE_SCAN_M <- 2200\n"""
          new_constants = """  AMBIGUITY_WIDE_TRIGGER_M <- 300\n  # Un snap muy lejano nunca debe resolverse silenciosamente como una sola cuenca.\n  # Si no se logra justificar como caso multicanal/confluencia, se pide otro clic.\n  AMBIGUITY_MAX_SINGLE_SNAP_M <- 600\n  AMBIGUITY_WIDE_SCAN_M <- 2200\n"""

          if text.count(old_constants) != 1:
              raise SystemExit('No se encontro de forma unica el bloque de constantes esperado.')
          text = text.replace(old_constants, new_constants, 1)

          old_return = """    if (!is.null(confluence)) {\n      return(confluence)\n    }\n\n    list(\n      status = 'single',\n      reason = 'UNAMBIGUOUS',\n      options = list(primary)\n    )\n"""
          new_return = """    if (!is.null(confluence)) {\n      return(confluence)\n    }\n\n    # Salvaguarda final: un ajuste muy lejano que no pudo explicarse\n    # como confluencia o rio ancho/multicanal no es suficientemente\n    # confiable para delimitar automaticamente. Esto evita saltos\n    # aguas abajo como el observado en rios amazonicos anchos.\n    if (primary_distance > AMBIGUITY_MAX_SINGLE_SNAP_M) {\n      stop(\n        paste0(\n          'El punto de salida requeriria desplazar el outlet ',\n          round(primary_distance),\n          ' m y no se identificaron alternativas hidrologicas confiables. ',\n          'Para evitar delimitar una cuenca incorrecta, haz clic mas cerca ',\n          'del eje del cauce deseado.'\n        )\n      )\n    }\n\n    list(\n      status = 'single',\n      reason = 'UNAMBIGUOUS',\n      options = list(primary)\n    )\n"""

          if text.count(old_return) != 1:
              raise SystemExit('No se encontro de forma unica el retorno single esperado.')
          text = text.replace(old_return, new_return, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch markers
        run: |
          grep -q 'AMBIGUITY_MAX_SINGLE_SNAP_M <- 600' R/delimitacion.R
          grep -q 'no se identificaron alternativas hidrologicas confiables' R/delimitacion.R

      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R/delimitacion.R
          git commit -m 'Bloquea snaps lejanos no resueltos en delimitacion'
          git push
