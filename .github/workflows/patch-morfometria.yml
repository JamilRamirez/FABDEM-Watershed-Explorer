name: Patch morfometria CRS scoring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_morfometria.py

      - name: Validate patch
        run: |
          git diff --check
          grep -n "score_epsg\|basin_score_geom\|map_diag_m\|box_score" R/morfometria.R

      - name: Commit fix if needed
        run: |
          if git diff --quiet -- R/morfometria.R; then
            echo "No morphometria changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/morfometria.R
          git commit -m "Fix morphometric map CRS scoring"
          git push origin main
