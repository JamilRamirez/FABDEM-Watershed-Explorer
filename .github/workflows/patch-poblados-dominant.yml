name: Patch poblados territorial dominance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-poblados-dominant.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply poblados dominance patch
        run: python .github/scripts/patch_poblados_dominant.py

      - name: Validate patch
        run: |
          git diff --check
          grep -n "dominant_territory\|dominant_department\|dominant_province\|dominant_district\|Concentración territorial" R/poblados.R

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/poblados.R
          if ! git diff --cached --quiet; then
            git commit -m "Add dominant territories to population map"
            git push origin main
          fi
