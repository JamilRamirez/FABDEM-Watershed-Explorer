name: Fix notification auto dismiss

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-notification-autodismiss.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Add notification auto-dismiss and close hitbox fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('app.R')
          text = path.read_text(encoding='utf-8')
          marker = '    tags$script(\n      src = "morfometria_layout.js"\n    ),\n'
          if 'fabdem-notification-autodismiss' in text:
              raise RuntimeError('El auto-dismiss de notificaciones ya existe.')
          payload = ''
          insert = base64.b64decode(payload).decode('utf-8')
          if marker not in text:
              raise RuntimeError('No se encontro el punto de insercion en tags$head().')
          path.write_text(text.replace(marker, marker + insert, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-notification-autodismiss.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.R
          git commit -m 'Autooculta avisos tras 10 segundos de inactividad'
          git push
