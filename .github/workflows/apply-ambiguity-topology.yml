name: Apply ambiguity topology refinement

on:
  push:
    branches:
      - feature/ambiguous-outlet-choice

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ambiguity-topology-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ambiguous-outlet-choice
          fetch-depth: 0

      - name: Apply topology refinement
        run: python3 tools/ci/refine_ambiguity_topology.py

      - name: Commit refined files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/delimitacion.R R/snap_topologico.R tests/ci/smoke_app.R
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refina seleccion ambigua con topologia D8 [ambiguity-topology-applied]"
          git push origin HEAD:feature/ambiguous-outlet-choice
