name: Ambiguity Runtime QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ambiguity-runtime-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup R 4.6.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install app dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::leaflet
            any::sf
            any::terra
            any::DT
            any::readxl
          cache-version: 1
          install-pandoc: false
          install-quarto: false

      - name: Run real Runtime ambiguity cases
        env:
          CI: 'true'
        shell: bash
        run: |
          set +e
          Rscript tools/ci/qa_ambiguity_runtime.R 2>&1 | tee qa_ambiguity_runtime.log
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Upload Runtime QA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambiguity-runtime-qa-log
          path: qa_ambiguity_runtime.log
          if-no-files-found: warn
          retention-days: 7
