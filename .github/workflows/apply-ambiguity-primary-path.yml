name: Apply ambiguity primary-path refinement

on:
  push:
    branches:
      - feature/ambiguous-outlet-choice

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ambiguity-primary-path-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ambiguous-outlet-choice
          fetch-depth: 0

      - name: Apply primary-path refinement
        run: python3 tools/ci/refine_ambiguity_primary_path.py

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/delimitacion.R tools/ci/qa_ambiguity_runtime.R
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Liga ambiguedad a trayectoria D8 principal [ambiguity-primary-path-applied]"
          git push origin HEAD:feature/ambiguous-outlet-choice
