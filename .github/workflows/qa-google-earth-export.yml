name: QA Google Earth export

on:
  push:
    branches:
      - feature/google-earth-kml-simplification
    paths:
      - .github/workflows/qa-google-earth-export.yml
      - R/helpers.R
      - R/delimitacion.R
      - tests/ci/test_google_earth_export.R

permissions:
  contents: read

jobs:
  google-earth-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R 4.6.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install sf
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sf
          cache-version: google-earth-export-1
          install-pandoc: false
          install-quarto: false

      - name: Run Google Earth geometry regression test
        run: Rscript tests/ci/test_google_earth_export.R
