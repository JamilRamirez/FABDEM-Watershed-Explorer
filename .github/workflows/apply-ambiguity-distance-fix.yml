name: Apply ambiguity distance fix

on:
  push:
    branches:
      - feature/ambiguous-outlet-choice

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ambiguity-distance-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ambiguous-outlet-choice
          fetch-depth: 0

      - name: Apply defensive distance fix
        run: python3 tools/ci/fix_ambiguity_distance.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/delimitacion.R
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Corrige distancia vacia en deteccion ambigua [ambiguity-distance-applied]"
          git push origin HEAD:feature/ambiguous-outlet-choice
