name: FABDEM Ambiguity Detect Quick
on:
  push:
    branches: ['qa/ambiguity-detect-quick-*']
    paths:
      - 'tests/qa/run_ambiguity_detect_quick.R'
      - '.github/workflows/ambiguity-detect-quick.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::leaflet
            any::sf
            any::terra
            any::DT
            any::readxl
          cache-version: 3
          install-pandoc: false
          install-quarto: false
      - run: Rscript tests/qa/run_ambiguity_detect_quick.R
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambiguity-detect-quick
          path: qa_results/ambiguity-detect/
          retention-days: 7
