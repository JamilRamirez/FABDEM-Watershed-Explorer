name: Consolidate morfometria v37

on:
  push:
    branches:
      - chore/consolidate-morfometria-v37
    paths:
      - .github/workflows/consolidate_morfometria.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/consolidate-morfometria-v37
          fetch-depth: 0

      - name: Consolidate canonical module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          morph_path = Path('R/morfometria.R')
          patch_path = Path('R/morfometria_graficos_v37.R')
          medio_path = Path('R/medio_fisico.R')
          workflow_path = Path('.github/workflows/consolidate_morfometria.yml')

          morph = morph_path.read_text(encoding='utf-8')
          patch = patch_path.read_text(encoding='utf-8')
          medio = medio_path.read_text(encoding='utf-8')

          hip_src = '.morph_draw_hipsometrica_v37 <- function(x) {'
          hist_src = '.morph_draw_hist_elevacion_v37 <- function(x) {'
          helper_src = '.morph_replace_region_v37 <- function('

          hip_start = patch.index(hip_src)
          hist_start = patch.index(hist_src)
          helper_start = patch.index(helper_src)

          hip_block = patch[hip_start:hist_start].strip()
          hist_block = patch[hist_start:helper_start].strip()

          def localize(block, old_name, new_name):
              lines = block.splitlines()
              lines[0] = lines[0].replace(old_name, new_name, 1)
              return '\n'.join('        ' + line if line else '' for line in lines)

          hip_block = localize(
              hip_block,
              '.morph_draw_hipsometrica_v37',
              'draw_hipsometrica_plot'
          )
          hist_block = localize(
              hist_block,
              '.morph_draw_hist_elevacion_v37',
              'draw_hist_elevacion_plot'
          )

          hip_marker = '        draw_hipsometrica_plot <- function(x) {'
          hist_marker = '        draw_hist_elevacion_plot <- function(x) {'
          slope_marker = '        draw_hist_pendiente_plot <- function(x) {'

          if morph.count(hip_marker) != 1:
              raise RuntimeError('Marcador hipsometrico canonico inesperado')
          if morph.count(hist_marker) != 1:
              raise RuntimeError('Marcador altitudinal canonico inesperado')
          if morph.count(slope_marker) != 1:
              raise RuntimeError('Marcador de pendiente canonico inesperado')

          a = morph.index(hip_marker)
          b = morph.index(hist_marker, a)
          morph = morph[:a] + hip_block + '\n\n\n' + morph[b:]

          b = morph.index(hist_marker, a)
          c = morph.index(slope_marker, b)
          morph = morph[:b] + hist_block + '\n\n\n' + morph[c:]

          morph = morph.replace(
              '# v35: MORFOMETRIA + DEM A3 UTM + SIMBOLOGIA STRAHLER REVISADA',
              '# v37: MORFOMETRIA CONSOLIDADA + LAMINA HIPSOMETRICA ESTABLE',
              1
          )
          morph = morph.replace(
              '# MODULO 02: MORFOMETRIA\n# v37: MORFOMETRIA CONSOLIDADA + LAMINA HIPSOMETRICA ESTABLE',
              '# MODULO 02: MORFOMETRIA\n# v37: MORFOMETRIA CONSOLIDADA + LAMINA HIPSOMETRICA ESTABLE\n# Graficas de relieve integradas directamente; sin parches en tiempo de ejecucion.',
              1
          )

          medio_new = re.sub(
              r'\n\n# Morfometria ya fue cargada por app\.R\..*?\n\nmedio_fisico <- local\(\{',
              '\n\nmedio_fisico <- local({',
              medio,
              count=1,
              flags=re.S
          )
          if medio_new == medio:
              raise RuntimeError('No se encontro el bloque de parche en medio_fisico.R')
          medio = medio_new

          morph_path.write_text(morph, encoding='utf-8', newline='\n')
          medio_path.write_text(medio, encoding='utf-8', newline='\n')
          patch_path.unlink()
          workflow_path.unlink()
          PY

      - name: Validate consolidation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          morph = Path('R/morfometria.R').read_text(encoding='utf-8')
          medio = Path('R/medio_fisico.R').read_text(encoding='utf-8')

          assert morph.count('draw_hipsometrica_plot <- function(x) {') == 1
          assert morph.count('draw_hist_elevacion_plot <- function(x) {') == 1
          assert '.morph_draw_hipsometrica_v37' not in morph
          assert '.morph_draw_hist_elevacion_v37' not in morph
          assert '.morph_replace_region_v37' not in morph
          assert 'morfometria_graficos_v37.R' not in medio
          assert not Path('R/morfometria_graficos_v37.R').exists()
          assert 'v37: MORFOMETRIA CONSOLIDADA' in morph
          print('Consolidacion textual validada.')
          PY

          if command -v Rscript >/dev/null 2>&1; then
            Rscript -e "parse(file='R/morfometria.R'); parse(file='R/medio_fisico.R'); cat('Sintaxis R valida.\\n')"
          else
            echo 'Rscript no disponible en runner; se omite parse R.'
          fi

          if grep -R -n --exclude-dir=.git 'morfometria_graficos_v37' .; then
            echo 'Quedaron referencias al parche v37.' >&2
            exit 1
          fi

      - name: Commit consolidated module
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolida morfometría v37 en módulo canónico'
          git push origin HEAD:chore/consolidate-morfometria-v37
