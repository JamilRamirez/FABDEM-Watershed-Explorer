name: Patch lazy runtime loading

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-lazy-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lazy runtime patch
        run: python .github/scripts/patch_lazy_runtime.py
      - name: Validate patch
        run: |
          git diff --check
          grep -n "runtime_asset_path\|runtime_cache_file(\|validate_stripe_sequence\|load_stream_stripe\|load_reverse_stripe" R/helpers.R | head -n 80
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/helpers.R
          if ! git diff --cached --quiet; then
            git commit -m "Use true lazy runtime stripe loading"
            git push origin main
          fi
