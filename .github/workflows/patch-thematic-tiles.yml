name: Patch thematic tile loading

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-thematic-tiles.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply thematic tile patch
        run: python .github/scripts/patch_thematic_tiles.py

      - name: Validate patch
        run: |
          git diff --check
          grep -n "runtime_raw_base_url\|runtime_is_lfs_pointer" R/config.R
          grep -n "índice teselado de Geología\|descargar una tesela de Geología" R/geologia.R
          grep -n "índice teselado de Geomorfología\|descargar una tesela de Geomorfología" R/geomorfologia.R

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/config.R R/geologia.R R/geomorfologia.R
          if ! git diff --cached --quiet; then
            git commit -m "Fix remote geology and geomorphology tile loading"
            git push origin main
          fi
